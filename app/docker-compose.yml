services:
  ansible-python-app:
    build: .    
    image: ansible_py-postgres:v0.1
    container_name: ansible-python-app
    networks:
      - my-network
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=postgres-db
      - DB_USER=root
      - DB_PASSWORD=1
      - DB_NAME=mydb

networks:
    my-network:      
      external : true

